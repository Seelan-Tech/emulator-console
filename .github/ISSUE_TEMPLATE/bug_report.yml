name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: What did you expect instead? }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Steps to reproduce, placeholder: "1. Open …\n2. Click …" }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Version / commit, placeholder: "v0.1.0 or a commit SHA" }
  - type: dropdown
    id: mode
    attributes: { label: Auth mode, options: [local, multi] }
  - type: textarea
    id: logs
    attributes: { label: Logs, description: "`docker compose logs console`. Remove anything sensitive.", render: shell }
