name: Dependency review

# Blocks a pull request that adds a dependency with a known vulnerability or a license we cannot ship under MIT.
on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    name: Dependency review
    # Needs GitHub Advanced Security, which is free only on public repositories.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0-only, AGPL-3.0-or-later, GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, SSPL-1.0
