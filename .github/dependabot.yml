version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      aws-sdk: { patterns: ["@aws-sdk/*", "@smithy/*"] }
      radix: { patterns: ["@radix-ui/*"] }
      codemirror: { patterns: ["@codemirror/*", "@uiw/*"] }
      types: { patterns: ["@types/*"] }
    commit-message: { prefix: "chore(deps)" }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"] # majors are taken by hand
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "chore(docker)" }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"] # majors are taken by hand
  - package-ecosystem: docker
    directory: /docker
    schedule: { interval: weekly }
    commit-message: { prefix: "chore(docker)" }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"] # majors are taken by hand
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "chore(ci)" }
